title: "About"
subtitle: "In a world where executives and companies face countless challenges, Thrive Leadership provides a unique approach that not only guides clients through these obstacles, but also teaches them how to handle future hardship. With a focus on leadership development, smart decision-making, and creative-problem solving, Thrive Leadership has been helping the professional community since 2000. Their clients include startup founders, corporate executives, and organizations of all sizes."
